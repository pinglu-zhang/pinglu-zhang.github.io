name: Get Citation Data

on:
  workflow_dispatch:
  schedule:
    - cron: '17 8 * * *'
  push:
    branches: [main]
    paths:
      - 'google_scholar_crawler/**'
      - '.github/workflows/google_scholar_crawler.yaml'

permissions:
  contents: write

concurrency:
  group: google-scholar-stats
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: google_scholar_crawler/requirements.txt
      - name: Install dependencies
        run: python -m pip install -r google_scholar_crawler/requirements.txt
      - name: Test parser and failure handling
        run: python -m unittest discover -s google_scholar_crawler -p 'test_*.py'
      - name: Check out previous citation data
        uses: actions/checkout@v4
        with:
          ref: google-scholar-stats
          path: citation-data
      - name: Refresh citation data
        env:
          GOOGLE_SCHOLAR_ID: ${{ secrets.GOOGLE_SCHOLAR_ID || 'T70BtHMAAAAJ' }}
        run: python google_scholar_crawler/main.py --previous citation-data/gs_data.json --output-dir citation-data
      - name: Publish validated data
        working-directory: citation-data
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add gs_data.json gs_data_shieldsio.json
          if git diff --cached --quiet; then
            echo 'Citation data unchanged.'
            exit 0
          fi
          git commit -m 'Refresh Google Scholar citations'
          git push origin HEAD:google-scholar-stats
