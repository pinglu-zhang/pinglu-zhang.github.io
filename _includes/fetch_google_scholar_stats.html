<script>
    $(document).ready(function () {
        {% if site.google_scholar_stats_use_cdn %}
        var gsDataBaseUrl = 'https://cdn.jsdelivr.net/gh/{{ site.repository }}@'
        {% else %}
        var gsDataBaseUrl = 'https://raw.githubusercontent.com/{{ site.repository }}/'
        {% endif %}
        $.getJSON(gsDataBaseUrl + "google-scholar-stats/gs_data.json", function (data) {
            // Render the badge from the same fresh data as the individual papers.
            // Its URL changes with the count, avoiding Shields endpoint cache lag.
            if (Number.isInteger(data.citedby) && data.citedby >= 0) {
                document.querySelectorAll('img[src*="img.shields.io/endpoint"]').forEach(function (image) {
                    var badge = new URL(image.src);
                    badge.pathname = '/badge/citations-' + data.citedby + '-9cf';
                    badge.searchParams.delete('url');
                    image.src = badge.toString();
                });
            }
            var citationEles = document.getElementsByClassName('show_paper_citations')
            Array.prototype.forEach.call(citationEles, element => {
                var paperId = element.getAttribute('data')
                var publication = data.publications && data.publications[paperId];
                if (!publication || typeof publication.num_citations !== 'number') return;
                element.textContent = '| {{ ui.citations }}: ' + publication.num_citations;
            });
        });
    })
</script>
